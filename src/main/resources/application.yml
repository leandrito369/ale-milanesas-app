spring:
  application:
    name: ale-milanesas-app
  datasource:
    url: jdbc:postgresql://${ALE_DB_HOST:localhost}:${ALE_DB_PORT:5432}/${ALE_DB_NAME:ale_milanesas_dev}
    username: ${ALE_DB_USER:ale_app}
    password: ${ALE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      schema: ale_gestion
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ale_gestion
    schemas:
      - ale_gestion
    locations:
      - classpath:db/migration
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  port: ${ALE_HTTP_PORT:8080}
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

ale:
  http:
    writes:
      categorias-uc57-enabled: false
      precios-uc19-enabled: false
      compras-uc08-insumo-enabled: false
      compras-uc08-reventa-enabled: false
      compras-uc42-enabled: false
