<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña · Ale Milanesas</title>
    <link th:if="${demoDisponible == true}" rel="stylesheet" th:href="@{/demo/demo.css}">
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="topbar">
    <div class="topbar-inner">
        <span class="brand-title">Ale Milanesas · Acceso interno</span>
    </div>
</header>
<main id="contenido" class="container auth-container">
    <section class="card" aria-labelledby="titulo">
        <h1 id="titulo">Cambiar contraseña</h1>
        <form th:action="@{/web/cambiar-clave}" method="post" autocomplete="off" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="credencialActual">Contraseña actual</label>
                <input type="password" id="credencialActual" name="credencialActual" aria-describedby="actual-ayuda">
                <span id="actual-ayuda" class="field-hint">Opcional solo en cambio obligatorio.</span>
            </div>
            <div class="field">
                <label for="nuevaCredencial">Nueva contraseña</label>
                <input type="password" id="nuevaCredencial" name="nuevaCredencial" required>
            </div>
            <div class="field">
                <label for="confirmacionNuevaCredencial">Confirmación</label>
                <input type="password" id="confirmacionNuevaCredencial" name="confirmacionNuevaCredencial" required>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Confirmar cambio</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
