<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ale Milanesas - Cambiar contraseña</title></head><body>
<main><h1>Cambiar contraseña</h1>
<form th:action="@{/web/cambiar-clave}" method="post" autocomplete="off">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Contraseña actual (opcional solo en cambio obligatorio)
<input type="password" name="credencialActual"></label>
<label>Nueva contraseña <input type="password" name="nuevaCredencial" required></label>
<label>Confirmación <input type="password" name="confirmacionNuevaCredencial" required></label>
<button type="submit">Confirmar cambio</button></form></main></body></html>
