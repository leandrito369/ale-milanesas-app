name: I1-04 - UC19 y UC20 Precios HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/web/RegistrarPrecioProductoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/ConsultarHistorialPreciosHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/maestros/ActualizarPrecioVigenteService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/maestros/ConsultarHistorialPreciosService.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/RegistrarPrecioProductoHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/ConsultarHistorialPreciosHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/maestros/PreciosProductoServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/maestros/PrecioProductoConcurrenciaIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/IngresoReventaFixture.java'
      - '.github/workflows/i1-04-precios-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precios-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Precios B4 y regresion B3 auth gates
        run: mvn -B -ntp -Dtest=RegistrarPrecioProductoHttpExternoTest,ConsultarHistorialPreciosHttpExternoTest,PreciosProductoServiceIntegrationTest,PrecioProductoConcurrenciaIntegrationTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-04-precios-http
          path: target/surefire-reports/
          if-no-files-found: warn
