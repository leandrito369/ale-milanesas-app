name: B4-06 - UC42 Ajuste Inventario INSUMO HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarAjusteInventarioService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/abastecimiento/EpisodioFaltanteService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarIngresoStockInsumoService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/RegistrarAjusteInventarioHttpController.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarAjusteInventarioServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/EpisodioFaltanteServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/AjusteInventarioFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/RegistrarAjusteInventarioHttpExternoTest.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarIngresoStockReventaService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/IngresoStockFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarIngresoStockInsumoServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/IngresoReventaFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarIngresoStockReventaServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - '.github/workflows/b4-06-uc42-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uc42-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: HTTP UC42 y regresion UC08/auth/gates
        run: mvn -B -ntp -Dtest=RegistrarAjusteInventarioServiceIntegrationTest,EpisodioFaltanteServiceIntegrationTest,RegistrarAjusteInventarioHttpExternoTest,RegistrarIngresoStockInsumoServiceIntegrationTest,RegistrarIngresoStockReventaServiceIntegrationTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-06-uc42-http
          path: target/surefire-reports/
          if-no-files-found: warn
