name: B1 - Maven / Testcontainers PostgreSQL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validar SHA y controles de CI
        run: |
          python3 -m unittest discover -s scripts/ci/tests -v
          python3 scripts/ci/validate_workflows.py
      - name: Docker availability (required by Testcontainers)
        run: docker info --format '{{.ServerVersion}}'
      - name: Build and test with ephemeral PostgreSQL
        run: mvn -B -ntp clean verify
      - name: Resumen cuantitativo JaCoCo de líneas y ramas
        run: python3 scripts/testing/report_coverage.py
      - name: Generar manifiesto de evidencia CI
        if: always()
        run: python3 scripts/ci/evidence.py
      - name: Attach test reports even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b1-surefire-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/jacoco.exec
            ci-evidence/
          if-no-files-found: warn
