name: B1 - Maven / Testcontainers PostgreSQL
on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/b1-build.yml'
      - 'docs/implementation/**'
      - 'compose.yaml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/b1-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker availability (required by Testcontainers)
        run: docker info --format '{{.ServerVersion}}'
      - name: Build and test with ephemeral PostgreSQL
        run: mvn -B -ntp clean verify
      - name: Attach test reports even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-surefire-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/jacoco.exec
          if-no-files-found: warn
