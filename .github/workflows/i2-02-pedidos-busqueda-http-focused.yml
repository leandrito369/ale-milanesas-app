name: I2-02 - UC34 Busqueda Pedidos B3 y HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/ventas/BuscarPedidoService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/BuscarPedidoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/acceso/AutorizacionSesionInterna.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/ventas/BuscarPedidoServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/ventas/BusquedaPedidoFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/ventas/PedidoFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/ventas/AsignacionRepartoFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/ventas/CargarPedidoServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/ventas/AsignarRepartoServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/BuscarPedidoHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - '.github/workflows/i2-02-pedidos-busqueda-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  busqueda-pedidos-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: UC34 lectura RBAC BC07 y regresion UC03 UC43 auth
        run: mvn -B -ntp -Dtest=BuscarPedidoServiceIntegrationTest,BuscarPedidoHttpExternoTest,CargarPedidoServiceIntegrationTest,AsignarRepartoServiceIntegrationTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2-02-busqueda-pedidos-http
          path: target/surefire-reports/
          if-no-files-found: warn
