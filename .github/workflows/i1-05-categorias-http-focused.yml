name: I1-05 - UC57 Politica Categoria HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/web/ConfigurarPoliticaCategoriaHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/finanzas/ConfigurarPoliticaCategoriaComercialService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/finanzas/EvaluadorCategoriaComercialInterno.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/finanzas/AplicarAjusteComercialService.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/ConfigurarPoliticaCategoriaHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/IngresoReventaFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/finanzas/CategoriaPoliticaServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/finanzas/PoliticaCategoriaConcurrenciaIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/finanzas/EvaluadorCategoriaComercialInternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/finanzas/CobroYCategoriaConciliacionIntegrationTest.java'
      - '.github/workflows/i1-05-categorias-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  categorias-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: UC57 HTTP y regresion UC15 UC16 auth gates
        run: mvn -B -ntp -Dtest=ConfigurarPoliticaCategoriaHttpExternoTest,CategoriaPoliticaServiceIntegrationTest,PoliticaCategoriaConcurrenciaIntegrationTest,EvaluadorCategoriaComercialInternoTest,CobroYCategoriaConciliacionIntegrationTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-05-categorias-http
          path: target/surefire-reports/
          if-no-files-found: warn
