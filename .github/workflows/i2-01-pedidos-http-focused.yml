name: I2-01 - UC03 Cargar Pedido B3 y HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/ventas/**'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/CargarPedidoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/ventas/**'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/CargarPedidoHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/finanzas/AplicarAjusteComercialService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/finanzas/EvaluadorCategoriaComercialInterno.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/finanzas/CategoriaPoliticaServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/maestros/PreciosProductoServiceIntegrationTest.java'
      - '.github/workflows/i2-01-pedidos-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pedidos-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: UC03 B3 HTTP concurrencia y regresion de categoria precios auth gates
        run: mvn -B -ntp -Dtest=CargarPedidoServiceIntegrationTest,CargarPedidoConcurrenciaIntegrationTest,CargarPedidoHttpExternoTest,CategoriaPoliticaServiceIntegrationTest,PoliticaCategoriaConcurrenciaIntegrationTest,EvaluadorCategoriaComercialInternoTest,CobroYCategoriaConciliacionIntegrationTest,PreciosProductoServiceIntegrationTest,PrecioProductoConcurrenciaIntegrationTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2-01-pedidos-http
          path: target/surefire-reports/
          if-no-files-found: warn
