name: B4-03-03 - UC38 HTTP real y regresion
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/web/**'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/**'
      - '.github/workflows/b4-03-03-uc38-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uc38-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker disponible
        run: docker info --format '{{.ServerVersion}}'
      - name: UC38 HTTP real, UC02, UC32 y autenticacion
        run: mvn -B -ntp -Dtest=EstadoClienteHttpExternoTest,ModificacionClienteHttpExternoTest,RegistroClienteHttpExternoTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Adjuntar evidencia de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-03-03-http-real
          path: target/surefire-reports/
          if-no-files-found: warn
