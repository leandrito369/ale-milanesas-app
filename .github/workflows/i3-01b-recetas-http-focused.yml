name: I3-01b - UC10 Configurar Receta B3 y HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/produccioninventario/ConfigurarRecetaService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/ConfigurarRecetaHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/produccioninventario/ConfigurarRecetaServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/produccioninventario/RecetaFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/ConfigurarRecetaHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/produccioninventario/ConsultarStockServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - '.github/workflows/i3-01b-recetas-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recetas-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: UC10 B3 HTTP y regresion stock auth gates
        run: mvn -B -ntp -Dtest=ConfigurarRecetaServiceIntegrationTest,ConfigurarRecetaHttpExternoTest,ConsultarStockServiceIntegrationTest,AutenticacionHttpExternaTest,PrecondicionesDespliegueTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i3-01b-recetas-http
          path: target/surefire-reports/
          if-no-files-found: warn
