name: B4-05 - UC08 Ingreso Stock Reventa HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarIngresoStockReventaService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/RegistrarIngresoStockReventaHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/IngresoReventaFixture.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarIngresoStockReventaServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/RegistrarIngresoStockReventaHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - '.github/workflows/b4-05-uc08-reventa-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uc08-reventa-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: HTTP UC08 REVENTA y regresion auth/gates
        run: mvn -B -ntp -Dtest=RegistrarIngresoStockReventaServiceIntegrationTest,RegistrarIngresoStockReventaHttpExternoTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-05-uc08-reventa-http
          path: target/surefire-reports/
          if-no-files-found: warn
