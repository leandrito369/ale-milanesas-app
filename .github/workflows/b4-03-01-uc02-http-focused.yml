name: B4-03-01 - UC02 HTTP real, gate y CSRF
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/web/**'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/**'
      - '.github/workflows/b4-03-01-uc02-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uc02-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker disponible
        run: docker info --format '{{.ServerVersion}}'
      - name: HTTP real UC02, prod deshabilitado y regresion de sesiones
        run: mvn -B -ntp -Dtest=RegistroClienteHttpExternoTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Evidencia Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-03-01-http-real
          path: target/surefire-reports/
          if-no-files-found: warn
