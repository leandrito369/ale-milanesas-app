name: B4-04 - UC08 Ingreso Stock Insumo HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/abastecimiento/RegistrarIngresoStockInsumoService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/RegistrarIngresoStockInsumoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/**'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/RegistrarIngresoStockInsumoHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - '.github/workflows/b4-04-uc08-insumo-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uc08-insumo-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: HTTP UC08 INSUMO y regresion auth/gates
        run: mvn -B -ntp -Dtest=RegistrarIngresoStockInsumoServiceIntegrationTest,RegistrarIngresoStockInsumoHttpExternoTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-04-uc08-insumo-http
          path: target/surefire-reports/
          if-no-files-found: warn
