name: B4-03-03 - Diagnostico SonarCloud PR42
on:
  push:
    branches: [feat/b4-03-03-uc38-http-gated-2026-11-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hallazgos publicos del analisis SonarCloud PR42
        run: |
          set -euo pipefail
          code=$(curl -sSL --max-time 25 -o /tmp/issues.json -w '%{http_code}' 'https://sonarcloud.io/api/issues/search?componentKeys=leandrito369_ale-milanesas-app&pullRequest=42&resolved=false&ps=100')
          echo "SonarCloud HTTP $code"
          test "$code" = 200
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/issues.json'))
          print('Hallazgos:',data.get('total'))
          for issue in data.get('issues',[]):
              print('regla=%s tipo=%s gravedad=%s archivo=%s linea=%s mensaje=%s' % (
                  issue.get('rule'),issue.get('type'),issue.get('severity'),
                  issue.get('component','').split(':')[-1],issue.get('line'),
                  issue.get('message')))
          PY
