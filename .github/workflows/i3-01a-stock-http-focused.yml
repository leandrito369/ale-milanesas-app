name: I3-01a - UC09 Consultar Stock B3 y HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/produccioninventario/ConsultarStockService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/ConsultarStockHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/produccioninventario/**'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/ConsultarStockHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/db/TrazabilidadPartidasMigrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/IngresoReventaFixture.java'
      - '.github/workflows/i3-01a-stock-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: UC09 B3 HTTP MR6 y regresion de autenticacion
        run: mvn -B -ntp -Dtest=ConsultarStockServiceIntegrationTest,ConsultarStockHttpExternoTest,TrazabilidadPartidasMigrationTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i3-01a-stock-http
          path: target/surefire-reports/
          if-no-files-found: warn
