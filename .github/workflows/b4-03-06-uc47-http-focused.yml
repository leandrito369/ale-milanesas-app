name: B4-03-06 - UC47 modificar Producto HTTP
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/maestros/GestionProductoService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/ModificacionProductoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/ModificacionProductoHttpExternoTest.java'
      - '.github/workflows/b4-03-06-uc47-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uc47-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: HTTP UC47 y regresion B3/gates/auth
        run: mvn -B -ntp -Dtest=ModificacionProductoHttpExternoTest,ConsultaProductoHttpExternoTest,RegistroProductoHttpExternoTest,GestionProductoServiceIntegrationTest,ProductoConcurrenciaIntegrationTest,PrecondicionesDespliegueTest,ConsultasI1HttpIntegrationTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-03-06-uc47-http
          path: target/surefire-reports/
          if-no-files-found: warn
