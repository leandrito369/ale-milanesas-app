name: I1-06 - UC50 UC51 UC52 Insumos HTTP y MR6
on:
  pull_request:
    paths:
      - 'src/main/java/ar/edu/unam/alemilanesas/web/RegistroInsumoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/ModificacionInsumoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/EstadoInsumoHttpController.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/SeguridadHttpInterna.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegue.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/maestros/GestionInsumosService.java'
      - 'src/main/java/ar/edu/unam/alemilanesas/web/ConsultasI1Controller.java'
      - 'src/main/resources/application.yml'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/RegistroInsumoHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/ModificacionInsumoHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/EstadoInsumoHttpExternoTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/ConsultasI1HttpIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/PrecondicionesDespliegueTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/web/AutenticacionHttpExternaTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/maestros/InsumosUnidadesServiceIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/maestros/InsumoConcurrenciaIntegrationTest.java'
      - 'src/test/java/ar/edu/unam/alemilanesas/abastecimiento/IngresoStockFixture.java'
      - '.github/workflows/i1-06-insumos-http-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  insumos-http-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: UC50 UC51 UC52 HTTP y regresion B3 UC36 auth gates
        run: mvn -B -ntp -Dtest=RegistroInsumoHttpExternoTest,ModificacionInsumoHttpExternoTest,EstadoInsumoHttpExternoTest,InsumosUnidadesServiceIntegrationTest,InsumoConcurrenciaIntegrationTest,ConsultasI1HttpIntegrationTest,PrecondicionesDespliegueTest,AutenticacionHttpExternaTest test
      - name: Reportes reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-06-insumos-http
          path: target/surefire-reports/
          if-no-files-found: warn
